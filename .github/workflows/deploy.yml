name: AWS Lakehouse Pipeline — CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'aws-lakehouse-pipeline/**'
  pull_request:
    branches: [main]
    paths:
      - 'aws-lakehouse-pipeline/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

env:
  AWS_REGION: ap-south-1
  TF_VERSION: 1.7.0
  PYTHON_VERSION: "3.12"
  WORKING_DIR: aws-lakehouse-pipeline

defaults:
  run:
    working-directory: aws-lakehouse-pipeline

jobs:

  # ─────────────────────────────────────────────
  # Job 1: Lint & Static Analysis
  # ─────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: |
          pip install flake8 pylint black isort pyflakes

      - name: Black formatting check
        run: black --check --diff glue_jobs/ lambda/ scripts/ data_quality/

      - name: isort import order check
        run: isort --check-only --diff glue_jobs/ lambda/ scripts/

      - name: Flake8 syntax check
        run: flake8 glue_jobs/ lambda/ scripts/ --max-line-length=120 --ignore=E501,W503

      - name: Terraform format check
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive terraform/


  # ─────────────────────────────────────────────
  # Job 2: Unit Tests (PySpark local mode)
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install pyspark==3.5.0 pytest pandas pyarrow boto3 moto[s3,sns,stepfunctions]

      - name: Run unit tests
        run: pytest scripts/tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: aws-lakehouse-pipeline/test-results.xml


  # ─────────────────────────────────────────────
  # Job 3: Terraform Plan (validate IaC)
  # ─────────────────────────────────────────────
  terraform-plan:
    name: 📐 Terraform Plan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: aws-lakehouse-pipeline/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: aws-lakehouse-pipeline/terraform

      - name: Terraform Plan
        run: terraform plan -var="environment=dev" -no-color -out=tfplan
        working-directory: aws-lakehouse-pipeline/terraform
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: aws-lakehouse-pipeline/terraform/tfplan


  # ─────────────────────────────────────────────
  # Job 4: Deploy Glue Scripts to S3
  # ─────────────────────────────────────────────
  deploy-scripts:
    name: 🚀 Deploy Glue Scripts to S3
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Sync Glue scripts to S3
        run: |
          SCRIPTS_BUCKET="${{ secrets.GLUE_SCRIPTS_BUCKET }}"
          aws s3 sync glue_jobs/ s3://${SCRIPTS_BUCKET}/scripts/ \
            --exclude "*" --include "*.py" \
            --sse AES256 \
            --delete
          echo "✅ Glue scripts deployed to s3://${SCRIPTS_BUCKET}/scripts/"

      - name: Sync Lambda packages to S3
        run: |
          SCRIPTS_BUCKET="${{ secrets.GLUE_SCRIPTS_BUCKET }}"
          # Package Lambda functions
          cd lambda/pipeline_trigger && zip -r handler.zip handler.py && cd ../..
          cd lambda/dq_alert && zip -r handler.zip handler.py && cd ../..
          aws s3 sync lambda/ s3://${SCRIPTS_BUCKET}/lambda/ \
            --exclude "*" --include "*.zip" --sse AES256
          echo "✅ Lambda packages deployed"


  # ─────────────────────────────────────────────
  # Job 5: Terraform Apply (main branch only)
  # ─────────────────────────────────────────────
  terraform-apply:
    name: ⚡ Terraform Apply
    runs-on: ubuntu-latest
    needs: [deploy-scripts]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: aws-lakehouse-pipeline/terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="environment=prod"
        working-directory: aws-lakehouse-pipeline/terraform
        env:
          TF_VAR_alert_email:              ${{ secrets.ALERT_EMAIL }}
          TF_VAR_redshift_admin_password:  ${{ secrets.REDSHIFT_ADMIN_PASSWORD }}

      - name: Post deploy summary
        run: |
          echo "### ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: prod" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        working-directory: aws-lakehouse-pipeline/terraform
